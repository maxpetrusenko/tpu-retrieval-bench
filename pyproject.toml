[project]
name = "trbench"
version = "0.1.0"
description = "Exact top-k retrieval benchmark on TPU: XLA vs Pallas"
requires-python = ">=3.12"
dependencies = ["jax>=0.12", "numpy>=2.2"]

[project.optional-dependencies]
hdf5 = ["h5py"]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
src = ["src", "bench", "tests"]
