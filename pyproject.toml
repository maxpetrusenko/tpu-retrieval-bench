[project]
name = "trbench"
version = "0.2.1"
description = "Exact top-k retrieval benchmark on TPU: XLA vs Pallas"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{ name = "Max Petrusenko" }]
keywords = ["tpu", "pallas", "jax", "top-k", "retrieval", "benchmark"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = ["jax>=0.12,<0.13", "jaxlib>=0.12,<0.13", "numpy>=2.2"]

[project.urls]
Repository = "https://github.com/maxpetrusenko/tpu-retrieval-bench"
Issues = "https://github.com/maxpetrusenko/tpu-retrieval-bench/issues"
Changelog = "https://github.com/maxpetrusenko/tpu-retrieval-bench/blob/main/CHANGELOG.md"

[project.optional-dependencies]
hdf5 = ["h5py"]
data = ["h5py"]
plot = ["matplotlib"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "nbformat",
    "h5py",
    "matplotlib",
    "hypothesis",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trbench"]
include = ["src/trbench/py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["fuzz: Hypothesis fuzz and property tests of the validator (CI runs them with more examples)"]

[tool.bandit]
# CI runs: bandit -c pyproject.toml -ll -r src bench scripts fuzz (medium severity and up).
# tests/ is not scanned: it asserts and shells out by design.
exclude_dirs = ["tests", ".venv"]
# B101 (assert): the asserts in src/ and bench/ are internal invariants and type narrowing, not
# input validation or access control; user input is checked with explicit raises. -ll already
# hides low severity, so this skip only keeps a plain `bandit -r` run readable.
skips = ["B101"]

[tool.coverage.run]
source = ["trbench", "bench"]

[tool.coverage.report]
# Measured 90.4% on 2026-11-22; threshold = measured minus 2, rounded down.
fail_under = 88
skip_covered = true
show_missing = true

[tool.ruff]
line-length = 100
extend-exclude = ["notebooks"]
src = ["src", "bench", "tests"]

[tool.mypy]
python_version = "3.12"
files = ["src/trbench", "bench"]
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
# bench/ (scripts and drivers) is checked with check_untyped_defs; src/trbench is strict (the
# override below spells out the strict flags, which mypy does not accept as a per-module group).
check_untyped_defs = true

[[tool.mypy.overrides]]
# the split run driver is fully annotated; the older scripts in bench/ are not (yet)
module = ["bench.run", "bench.cli", "bench.algos", "bench.plan", "bench.execute", "bench.emit"]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = ["trbench", "trbench.*"]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true
