[project]
name = "trbench"
version = "0.1.0"
description = "Exact top-k retrieval benchmark on TPU: XLA vs Pallas"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["jax>=0.12,<0.13", "jaxlib>=0.12,<0.13", "numpy>=2.2"]

[project.optional-dependencies]
hdf5 = ["h5py"]
data = ["h5py"]
plot = ["matplotlib"]

[dependency-groups]
dev = ["pytest", "ruff", "nbformat", "h5py", "matplotlib", "hypothesis"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
extend-exclude = ["notebooks"]
src = ["src", "bench", "tests"]
