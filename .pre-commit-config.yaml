repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
  - repo: local
    hooks:
      - id: notebook-outputs
        name: notebooks must have no outputs
        language: system
        entry: uv run python -I scripts/check_notebook_outputs.py
        files: \.ipynb$
