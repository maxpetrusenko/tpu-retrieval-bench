name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions: {}
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  JAX_PLATFORMS: cpu
jobs:
  lint-test:
    name: lint-test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: pytest with coverage (threshold in pyproject.toml)
        run: uv run pytest -q --cov
      - name: committed TPU results validate (strict, no dirty records)
        run: uv run python -m bench.validate_results --strict results/tpu/run3 results/tpu/run3-devtime results/tpu/run4 results/tpu/run4-devtime
      - name: doc counts equal the JSON
        run: uv run python -m bench.doc_stats --check docs/RESULTS.md
      - name: reproduce_all dry run
        run: DRY_RUN=1 bash scripts/reproduce_all.sh results/ci-dry-run
      - name: tpu_smoke dry run
        run: DRY_RUN=1 bash scripts/tpu_smoke.sh results/ci-dry-smoke
      - name: notebook constraints match uv.lock
        run: bash scripts/export_constraints.sh --check
  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      - name: build sdist and wheel
        run: uv build
      - name: install the wheel into a fresh venv, import it, check py.typed
        run: |
          uv venv "$RUNNER_TEMP/wheel-venv"
          uv pip install --python "$RUNNER_TEMP/wheel-venv/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-venv/bin/python" - <<'PY'
          import importlib.resources
          import trbench
          assert importlib.resources.files("trbench").joinpath("py.typed").is_file(), "py.typed missing"
          print("trbench imported from", trbench.__file__)
          PY
  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      - name: export the locked dependency set
        run: uv export --frozen --no-hashes --no-emit-project --all-extras --all-groups -o "$RUNNER_TEMP/requirements.txt"
      - name: pip-audit against the lock (no resolution, no install)
        run: uvx pip-audit==2.10.1 -r "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip
  fuzz:
    name: fuzz (hypothesis)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - name: fuzz the validator and record parsing (more examples than the default suite)
        env:
          FUZZ_EXAMPLES: "2000"
        run: uv run pytest -m fuzz -q -p no:cacheprovider
  sast:
    name: sast (bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      - name: bandit, medium severity and up (config in pyproject.toml)
        run: uvx --from "bandit[toml]==1.9.4" bandit -c pyproject.toml -ll -r src bench scripts fuzz
  test:
    # Self-hosted runner: push to main and manual dispatch only, never a pull request, so fork
    # code cannot reach it. Isolation of the runner is described in SECURITY.md.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, vps-builder]
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv run python -m bench.validate_results results/tpu
